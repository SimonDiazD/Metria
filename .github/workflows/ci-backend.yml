name: CI Backend

on:
  pull_request:
    paths:
      - "backend/**"
  push:
    branches: [main, dev]
    paths:
      - "backend/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Conceder permisos de ejecución a Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Linter (verificación de estilo con Checkstyle)
        run: ./gradlew checkstyleMain checkstyleTest --continue

      - name: Ejecutar pruebas (TDD)
        run: ./gradlew test

      - name: Build (empaquetar sin ejecutar pruebas de nuevo)
        run: ./gradlew build -x test

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Escaneo de dependencias vulnerables
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
